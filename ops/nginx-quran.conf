# nginx для quran.nurtech.dev — статический Astro-сайт.
# По образцу /etc/nginx/sites-enabled/aiengineer.nurtech.dev (тот же VPS 85.239.36.234).
# Ставится финально ПОСЛЕ выпуска сертификата (сам сертификат — certbot certonly --webroot; см. ops/SETUP.md).

server {
    listen 80;
    listen [::]:80;
    server_name quran.nurtech.dev;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name quran.nurtech.dev;

    root /var/www/quran.nurtech.dev;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml application/manifest+json;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location ~* \.(?:woff2|woff|ttf|otf|eot)$ { types { font/woff2 woff2; font/woff woff; font/ttf ttf; font/otf otf; application/vnd.ms-fontobject eot; } add_header Cache-Control "public, max-age=31536000, immutable"; add_header X-Content-Type-Options "nosniff" always; access_log off; try_files $uri =404; }
    location ~* \.(?:webp|avif|jpg|jpeg|png|gif|ico|svg)$ { add_header Cache-Control "public, max-age=2592000"; add_header X-Content-Type-Options "nosniff" always; access_log off; try_files $uri =404; }
    # service worker и manifest — без агрессивного кэша (чтобы обновления PWA доходили)
    location = /sw.js { add_header Cache-Control "no-cache"; add_header Service-Worker-Allowed "/"; try_files $uri =404; }
    location = /manifest.webmanifest { add_header Cache-Control "no-cache"; types { application/manifest+json webmanifest; } try_files $uri =404; }

    location ~* \.(?:css|js)$ { add_header Cache-Control "public, max-age=604800"; add_header X-Content-Type-Options "nosniff" always; access_log off; try_files $uri =404; }

    # данные Корана (index/search-index/reciters.json) — без агрессивного кэша,
    # чтобы правки данных (новые чтецы и т.п.) подхватывались сразу (revalidate)
    location /data/ { add_header Cache-Control "no-cache"; access_log off; try_files $uri =404; }

    # анонимная статистика чтения: отдельный маленький Node-сервис на localhost.
    location /api/ {
        proxy_pass http://127.0.0.1:4317;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    ssl_certificate /etc/letsencrypt/live/quran.nurtech.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/quran.nurtech.dev/privkey.pem;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # чистые URL Astro (/surah/1 -> /surah/1/index.html); короткие /2:255 -> 404.html (JS-редирект)
    error_page 404 /404.html;
    location / {
        expires -1;
        try_files $uri $uri/ =404;
    }
}
