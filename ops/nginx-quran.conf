# nginx для quran.nurtech.dev — статический Astro-сайт.
# Установка один раз (см. ops/SETUP.md). SSL добавит certbot автоматически.

server {
    listen 80;
    listen [::]:80;
    server_name quran.nurtech.dev;

    root /var/www/quran.nurtech.dev;
    index index.html;

    # gzip для текстовых данных (search-index.json ~1.5 МБ, HTML, JS, CSS)
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               image/svg+xml font/woff2 application/manifest+json;

    # чистые URL: /surah/1 -> /surah/1/index.html; неизвестное -> 404.html
    # (404.html редиректит короткие ссылки вида /2:255 -> /ayah/2/255)
    error_page 404 /404.html;
    location / {
        try_files $uri $uri/ $uri.html /404.html;
    }

    # шрифты и статические ассеты — на год, immutable
    location /fonts/ {
        expires 365d;
        add_header Cache-Control "public, immutable";
    }
    location /assets/ {
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    # данные Корана — сутки (обновляются редко)
    location /data/ {
        expires 1d;
        add_header Cache-Control "public";
    }

    # HTML не кэшируем агрессивно (чтобы деплой был виден сразу)
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-cache";
    }
}
